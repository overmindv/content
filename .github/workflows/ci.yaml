name: bumblebee-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: overmindv
  IMAGE_NAME: bumblebee

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint proto
        run: buf lint
      - name: Check proto formatting
        run: buf format --diff --exit-code
      - name: Regenerate proto and mocks
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            golang:1.26.1-bookworm \
            sh -c "apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev make && rm -rf /var/lib/apt/lists/* && make generate"
      - name: Verify generated files are committed
        run: git diff --exit-code internal/pkg/api internal/mock

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build service
        run: make build

  docker-build:
    runs-on: ubuntu-latest
    needs: [proto, lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull --tag "$REGISTRY/$IMAGE_OWNER/$IMAGE_NAME:ci" .

  component-test-postgres:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bumblebee
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bumblebee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DSN: postgres://postgres@localhost:5432/bumblebee?sslmode=disable
      COMPONENT_TEST_DSN: postgres://postgres@localhost:5432/bumblebee?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply schema migrations
        run: make db-up
      - name: Run component tests
        run: make ctest

  publish-image:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
