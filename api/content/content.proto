syntax = "proto3";

package overmindv.content;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/overmindv/content/pkg/api/content;content";

message ContentLearningMetadata {
  repeated string topic_ids = 1;
  int32 estimated_minutes = 2;
  repeated string learning_outcomes = 3;
}

message ContentItem {
  string id = 1;
  string type = 2;
  string status = 3;
  string title = 4;
  string slug = 5;
  string description = 6;
  string current_revision_id = 7;
  string published_revision_id = 8;
  string created_by = 9;
  string updated_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp published_at = 13;
  google.protobuf.Timestamp archived_at = 14;
  ContentRevision current_revision = 15;
  repeated Tag tags = 16;
  repeated ContentAsset assets = 17;
  ContentLearningMetadata learning = 18;
}

message ContentRevision {
  string id = 1;
  string content_item_id = 2;
  int32 revision = 3;
  string format = 4;
  string source = 5;
  string source_hash = 6;
  string message = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
}

message Tag {
  string id = 1;
  string name = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ContentAsset {
  string id = 1;
  string content_item_id = 2;
  string revision_id = 3;
  string asset_id = 4;
  string kind = 5;
  string title = 6;
  int32 position = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateContentAsset {
  string asset_id = 1;
  string kind = 2;
  string title = 3;
  int32 position = 4;
}

message AttachmentSet {
  repeated CreateContentAsset assets = 1;
}

message CreateContentItemRequest {
  string type = 1;
  string status = 2;
  string title = 3;
  string slug = 4;
  string description = 5;
  string format = 6;
  string source = 7;
  string message = 8;
  string created_by = 9;
  repeated string tags = 10;
  repeated CreateContentAsset assets = 11;
  ContentLearningMetadata learning = 12;
}

message CreateContentItemResponse {
  ContentItem item = 1;
}

message GetContentItemRequest {
  string id = 1;
}

message GetContentItemResponse {
  ContentItem item = 1;
}

message GetPublishedContentItemRequest {
  string id = 1;
}

message GetPublishedContentItemResponse {
  ContentItem item = 1;
}

message ListContentItemsRequest {}

message ListContentItemsResponse {
  repeated ContentItem items = 1;
}

message UpdateContentItemRequest {
  string id = 1;
  string type = 2;
  string status = 3;
  string title = 4;
  string slug = 5;
  string description = 6;
  string updated_by = 7;
  ContentLearningMetadata learning = 8;
}

message ContentCatalogEntry {
  string id = 1;
  string title = 2;
  string slug = 3;
  string status = 4;
  string author_id = 5;
  google.protobuf.Timestamp created_at = 6;
  string revision_id = 7;
  ContentLearningMetadata learning = 8;
}

message ListContentCatalogRequest {
  string topic_id = 1;
  string author_id = 2;
  string status = 3;
  int32 page_size = 4;
  string cursor = 5;
}

message ListContentCatalogResponse {
  repeated ContentCatalogEntry entries = 1;
  string next_cursor = 2;
}

message UpdateContentItemResponse {
  ContentItem item = 1;
}

message DeleteContentItemRequest {
  string id = 1;
}

message DeleteContentItemResponse {
  ContentItem item = 1;
}

message CreateContentRevisionRequest {
  string content_item_id = 1;
  string format = 2;
  string source = 3;
  string message = 4;
  string created_by = 5;
  string expected_revision_id = 6;
  AttachmentSet attachments = 7;
}

message CreateContentRevisionResponse {
  ContentRevision revision = 1;
}

message ListContentRevisionsRequest {
  string content_item_id = 1;
}

message ListContentRevisionsResponse {
  repeated ContentRevision revisions = 1;
}

message ListContentRevisionHistoryRequest {
  string content_item_id = 1;
  int32 page_size = 2;
  int32 before_revision = 3;
}

message ContentRevisionSummary {
  string id = 1;
  int32 revision = 2;
  string format = 3;
  string message = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  string restored_from_revision_id = 7;
}

message ListContentRevisionHistoryResponse {
  repeated ContentRevisionSummary items = 1;
  int32 next_before_revision = 2;
}

message PublishContentItemRequest {
  string id = 1;
  string expected_revision_id = 2;
}

message PublishContentItemResponse {
  ContentItem item = 1;
}

message ArchiveContentItemRequest {
  string id = 1;
  string expected_revision_id = 2;
}

message ArchiveContentItemResponse {
  ContentItem item = 1;
}

message ChangeProposal {
  string id = 1;
  string content_item_id = 2;
  string base_revision_id = 3;
  string author_id = 4;
  string status = 5;
  ChangeProposalRevision head = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp closed_at = 8;
}

message ChangeProposalRevision {
  string id = 1;
  string parent_revision_id = 2;
  int32 ordinal = 3;
  string source = 4;
  string message = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated ContentAsset assets = 7;
}

message OpenChangeProposalRequest {
  string content_item_id = 1;
  string base_revision_id = 2;
  string source = 3;
  string message = 4;
  AttachmentSet attachments = 5;
}

message OpenChangeProposalResponse {
  ChangeProposal proposal = 1;
}

message GetChangeProposalRequest {
  string proposal_id = 1;
}

message GetChangeProposalResponse {
  ChangeProposal proposal = 1;
}

message AppendChangeProposalRevisionRequest {
  string proposal_id = 1;
  string expected_head_id = 2;
  string source = 3;
  string message = 4;
  AttachmentSet attachments = 5;
}

message AppendChangeProposalRevisionResponse {
  ChangeProposal proposal = 1;
}

message CloseChangeProposalRequest {
  string proposal_id = 1;
}

message CloseChangeProposalResponse {
  ChangeProposal proposal = 1;
}

message ChangeProposalHistoryEntry {
  string id = 1;
  string parent_revision_id = 2;
  int32 ordinal = 3;
  string author_id = 4;
  string message = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListChangeProposalHistoryRequest {
  string proposal_id = 1;
  int32 before_ordinal = 2;
  int32 page_size = 3;
}

message ListChangeProposalHistoryResponse {
  repeated ChangeProposalHistoryEntry entries = 1;
  int32 next_before_ordinal = 2;
}

message GetChangeProposalDiffRequest {
  string proposal_id = 1;
  string revision_id = 2;
}

message GetChangeProposalDiffResponse {
  string base_revision_id = 1;
  string revision_id = 2;
  string unified_diff = 3;
  bool truncated = 4;
}

message ReviewThread {
  int64 id = 1;
  string revision_id = 2;
  int32 line_number = 3;
  string author_id = 4;
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
  bool resolved = 7;
  google.protobuf.Timestamp resolved_at = 8;
  string resolved_by = 9;
}

message ReviewReply {
  int64 id = 1;
  string author_id = 2;
  string body = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ReviewDecision {
  string reviewer_id = 1;
  string decision = 2;
  string reason = 3;
  google.protobuf.Timestamp created_at = 4;
  bool legacy = 5;
}

message ReviewAssignment {
  string reviewer_id = 1;
  int32 slot = 2;
}

message CreateReviewThreadRequest {
  string proposal_id = 1;
  string revision_id = 2;
  int32 line_number = 3;
  string body = 4;
}

message CreateReviewThreadResponse {
  ReviewThread thread = 1;
}

message ReplyToReviewThreadRequest {
  string proposal_id = 1;
  int64 thread_id = 2;
  string body = 3;
}

message ReplyToReviewThreadResponse {
  ReviewReply reply = 1;
}

message SetReviewThreadResolvedRequest {
  string proposal_id = 1;
  int64 thread_id = 2;
  bool resolved = 3;
}

message SetReviewThreadResolvedResponse {
  ReviewThread thread = 1;
}

message ListReviewThreadsRequest {
  string proposal_id = 1;
  int64 after_id = 2;
  int32 page_size = 3;
}

message ListReviewThreadsResponse {
  repeated ReviewThread threads = 1;
  int64 next_after_id = 2;
}

message ListReviewRepliesRequest {
  string proposal_id = 1;
  int64 thread_id = 2;
  int64 after_id = 3;
  int32 page_size = 4;
}

message ListReviewRepliesResponse {
  repeated ReviewReply replies = 1;
  int64 next_after_id = 2;
}

message SubmitReviewDecisionRequest {
  string proposal_id = 1;
  string revision_id = 2;
  string decision = 3;
  string reason = 4;
}

message SubmitReviewDecisionResponse {
  ReviewDecision decision = 1;
}

message GetReviewRevisionStatusRequest {
  string proposal_id = 1;
  string revision_id = 2;
}

message GetReviewRevisionStatusResponse {
  string revision_id = 1;
  bool current = 2;
  repeated ReviewDecision decisions = 3;
  repeated ReviewAssignment assignments = 4;
  string outcome = 5;
  string wait_reason = 6;
  string topic_id = 7;
}

service ContentService {
  rpc CreateContentItem(CreateContentItemRequest) returns (CreateContentItemResponse);
  rpc GetContentItem(GetContentItemRequest) returns (GetContentItemResponse);
  rpc GetPublishedContentItem(GetPublishedContentItemRequest) returns (GetPublishedContentItemResponse);
  rpc ListContentItems(ListContentItemsRequest) returns (ListContentItemsResponse);
  rpc ListContentCatalog(ListContentCatalogRequest) returns (ListContentCatalogResponse);
  rpc UpdateContentItem(UpdateContentItemRequest) returns (UpdateContentItemResponse);
  rpc DeleteContentItem(DeleteContentItemRequest) returns (DeleteContentItemResponse);
  rpc CreateContentRevision(CreateContentRevisionRequest) returns (CreateContentRevisionResponse);
  rpc ListContentRevisions(ListContentRevisionsRequest) returns (ListContentRevisionsResponse);
  rpc ListContentRevisionHistory(ListContentRevisionHistoryRequest) returns (ListContentRevisionHistoryResponse);
  rpc PublishContentItem(PublishContentItemRequest) returns (PublishContentItemResponse);
  rpc ArchiveContentItem(ArchiveContentItemRequest) returns (ArchiveContentItemResponse);
  rpc OpenChangeProposal(OpenChangeProposalRequest) returns (OpenChangeProposalResponse);
  rpc GetChangeProposal(GetChangeProposalRequest) returns (GetChangeProposalResponse);
  rpc AppendChangeProposalRevision(AppendChangeProposalRevisionRequest) returns (AppendChangeProposalRevisionResponse);
  rpc CloseChangeProposal(CloseChangeProposalRequest) returns (CloseChangeProposalResponse);
  rpc ListChangeProposalHistory(ListChangeProposalHistoryRequest) returns (ListChangeProposalHistoryResponse);
  rpc GetChangeProposalDiff(GetChangeProposalDiffRequest) returns (GetChangeProposalDiffResponse);
  rpc CreateReviewThread(CreateReviewThreadRequest) returns (CreateReviewThreadResponse);
  rpc ReplyToReviewThread(ReplyToReviewThreadRequest) returns (ReplyToReviewThreadResponse);
  rpc SetReviewThreadResolved(SetReviewThreadResolvedRequest) returns (SetReviewThreadResolvedResponse);
  rpc ListReviewThreads(ListReviewThreadsRequest) returns (ListReviewThreadsResponse);
  rpc ListReviewReplies(ListReviewRepliesRequest) returns (ListReviewRepliesResponse);
  rpc SubmitReviewDecision(SubmitReviewDecisionRequest) returns (SubmitReviewDecisionResponse);
  rpc GetReviewRevisionStatus(GetReviewRevisionStatusRequest) returns (GetReviewRevisionStatusResponse);
}
